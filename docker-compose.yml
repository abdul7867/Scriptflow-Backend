services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.aws
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Memory optimized for t3.micro (1GB RAM) - heap 512MB, expose GC for memory governor
      # CRITICAL: These values MUST match Dockerfile defaults and memoryGovernor config
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--max-old-space-size=600 --expose-gc
      - MEMORY_HEAP_LIMIT_MB=600
      - QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-2}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      # Vertex AI (replaces GEMINI_API_KEY)
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-service-account.json
      - MANYCHAT_API_KEY=${MANYCHAT_API_KEY}
      - MANYCHAT_SC_STATUS_FIELD_ID=${MANYCHAT_SC_STATUS_FIELD_ID:-}
      - MANYCHAT_SC_LAST_SCRIPT_FIELD_ID=${MANYCHAT_SC_LAST_SCRIPT_FIELD_ID}
      - MANYCHAT_SC_LAST_IMAGE_FIELD_ID=${MANYCHAT_SC_LAST_IMAGE_FIELD_ID}
      - MANYCHAT_SC_COPY_URL_FIELD_ID=${MANYCHAT_SC_COPY_URL_FIELD_ID:-}
      # V2 Primary Fields - script_image change triggers ManyChat Rule
      - MANYCHAT_AI_GENERATED_SCRIPT_FIELD_ID=${MANYCHAT_AI_GENERATED_SCRIPT_FIELD_ID:-}
      - MANYCHAT_SCRIPT_IMAGE_FIELD_ID=${MANYCHAT_SCRIPT_IMAGE_FIELD_ID:-}
      - MANYCHAT_SCRIPT_COPY_LINK_FIELD_ID=${MANYCHAT_SCRIPT_COPY_LINK_FIELD_ID:-}
      # V2 Carousel Fields - 3 separate images for Gallery carousel
      - MANYCHAT_CAROUSEL_HOOK_FIELD_ID=${MANYCHAT_CAROUSEL_HOOK_FIELD_ID:-}
      - MANYCHAT_CAROUSEL_BODY_FIELD_ID=${MANYCHAT_CAROUSEL_BODY_FIELD_ID:-}
      - MANYCHAT_CAROUSEL_CTA_FIELD_ID=${MANYCHAT_CAROUSEL_CTA_FIELD_ID:-}
      # Legacy fields (keep if needed for backward compatibility)
      - MANYCHAT_SCRIPT_FIELD_ID=${MANYCHAT_SCRIPT_FIELD_ID:-}
      - MANYCHAT_COPY_FIELD_ID=${MANYCHAT_COPY_FIELD_ID:-}
      - IMGBB_API_KEY=${IMGBB_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ANALYSIS_MODE=${ANALYSIS_MODE:-hybrid}
      - BASE_URL=${BASE_URL:-}
      - INSTAGRAM_COOKIES_PATH=/app/secrets/instagram_cookies.txt
      # AWS S3 Configuration (optional - for image hosting)
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      # Image Provider: imgbb (recommended for ManyChat) or cloudinary
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-imgbb}
      # Cloudinary configuration (optional, if using cloudinary provider)
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      # User limits
      - USER_RATE_LIMIT=${USER_RATE_LIMIT:-10}
      - MAX_BETA_USERS=${MAX_BETA_USERS:-100}
    volumes:
      - ./temp:/app/temp
      - ./fonts:/app/fonts
      - ./secrets:/app/secrets:ro
    deploy:
      resources:
        limits:
          # Reduced for t3.micro (1GB RAM) - leave room for OS/FFmpeg/yt-dlp
          memory: 800M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (only for local development)
  # In production, use Upstash or Redis Cloud
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (only for local development)
  # In production, use MongoDB Atlas
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=scriptflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - local # Only start in local profile

volumes:
  redis_data:
  mongodb_data:

# Usage:
# Production (uses external MongoDB Atlas + Upstash Redis):
#   docker-compose up app
#
# Local Development (with local MongoDB + Redis):
#   docker-compose --profile local up
